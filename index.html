었던 학생의 특징\n\n1. 적극적이고 예의바른 태도\n자신의 진로와 내 분야가 전혀 다른데도\n내게 와서 먼저 인사하고 자신을 소개한다\n예의바르고 멘토가 하는 말을 귀담아듣는다\n\n2. 진로에 대한 진지한 고민\n자신이 생각하는 진로\n그걸 이루기 위해 하고 있는 행동\n\n거기에서 생기는 또다른 고민과 문제를 \n가감없이 이야기 한다\n도움을 주고싶어지는 생각과 스피치를 한다\n\n3. 진부하지만 부지런한 학교생활\n대학교에서 했던 활동이 많아서\n무엇을 무기로 내세워야 가장 좋을지\n고민이 될 정도다", "d": "2026-08-09", "cat": "취업준비 전반 팁", "fav": false, "h": false}, {"c": "DNsqbgE5MjA", "u": "https://www.threads.com/@jickjin2025/post/DNsqbgE5MjA", "du": "threads.com/@jickjin2025/post/DNsqbgE5MjA", "t": "취업 준비 당시 내 스펙은", "at": "취업 준비 당시 내 스펙은", "s": "이공계(공학) 전공 학점 3.5/4.5 토익 960 오픽 AL 기사 자격증 1개 공기업 계약직 인턴 3개월 그밖에 경험으로 자소서에 녹일 수 있는 동아리, 알바 활동 등. 4학년 2학기에 바로 공채 지원할 수 있게 사전에 준비했었고 연말에 최종적으로…", "b": "취업 준비 당시 내 스펙은\n\n이공계(공학) 전공\n학점 3.5/4.5\n토익 960\n오픽 AL\n기사 자격증 1개\n공기업 계약직 인턴 3개월 \n\n그밖에 경험으로 자소서에 녹일 수 있는\n동아리, 알바 활동 등.\n\n4학년 2학기에 바로 공채 지원할 수 있게\n사전에 준비했었고 연말에\n최종적으로 4개 회사에 합격했어.\n\n그 때 하루 루틴도 공유할게!", "d": "2025-08-23", "cat": "자기소개서 준비 팁", "fav": false, "h": false}, {"c": "DSMckQyCE-x", "u": "https://www.threads.com/@jickjin2025/post/DSMckQyCE-x", "du": "threads.com/@jickjin2025/post/DSMckQyCE-x", "t": "현재 시점 기준 통폐합 이슈되고 있는 기관들", "at": "현재 시점 기준 통폐합 이슈되고 있는 기관들", "s": "1. 발전 : 5대 발전사(동서, 남부, 남동, 서부, 중부) 2. 철도 : 한국철도공사, SR 3. 주거 : 주택도시보증공사, 주택금융공사, 토지주택공사 통폐합으로 지원 고민도 있겠지만 그보다는 우선 PT면접이나 임원면접에서 이슈가 어떻게 활용될지…", "b": "현재 시점 기준 통폐합 이슈되고 있는 기관들\n\n1. 발전 : 5대 발전사(동서, 남부, 남동, 서부, 중부)\n\n2. 철도 : 한국철도공사, SR\n\n3. 주거 : 주택도시보증공사, 주택금융공사, \n토지주택공사\n\n통폐합으로 지원 고민도 있겠지만\n그보다는 우선 PT면접이나 임원면접에서\n이슈가 어떻게 활용될지를 고민해보자.\n\n입사 고민은 최종 합격자만 하는 것이다..!", "d": "2025-12-13", "cat": "면접 준비 팁", "fav": false, "h": false}, {"c": "DPROgpjksZv", "u": "https://www.threads.com/@jickjin2025/post/DPROgpjksZv", "du": "threads.com/@jickjin2025/post/DPROgpjksZv", "t": "취업 준비에 도움이 되는 알바 경험 스토리텔링", "at": "취업 준비에 도움이 되는 알바 경험 스토리텔링", "s": "1. 편의점 고객 응대/클레임 처리 재고 관리 및 판매 데이터 분석 점장과의 커뮤니케이션 2. 카페 고객 응대/클레임 처리 팀워크, 멀티 태스킹 3. 학원 조교 업무 체계화(커리큘럼, 학생 니즈 반영 등) 학생, 학부모 사이 이해관계 조율, 소통능력", "b": "-취업 준비에 도움이 되는 알바 경험 스토리텔링\n\n1. 편의점\  옆의 지원자보다 본인이 잘 답변하고 있는거 같아요?\n\n4. 생각보다 워라밸이 지켜지지 않는다면 어떻게 하실건가요?\n\n5. 공공기관 부채비율이 높은 것에 대해서 어떻게 생각하나요?", "d": "2025-09-26", "cat": "면접 준비 팁", "fav": false, "h": false}, {"c": "DQv9qpuAfCd", "u": "https://www.threads.com/@jickjin2025/post/DQv9qpuAfCd", "du": "threads.com/@jickjin2025/post/DQv9qpuAfCd", "t": "Q. 공백 상태로 취업 준비 집중해도 될까요?", "at": "Q. 공백 상태로 취업 준비 집중해도 될까요?", "s": "계약직, 인턴, 알바, 본래의 현업 등 수입을 유지하지 않고 온전히 취업에만 집중하려면 하루 최소 8~9시간은 취업 준비에 투자해야하고 그 루틴을 3개월 이상 유지해야합니다. 일을 하지 않는만큼 그 시간을 취업에 쓴다는건 레버리지니까요.", "b": "Q. 공백 상태로 취업 준비 집중해도 될까요?\n\n계약직, 인턴, 알바, 본래의 현업 등\n수입을 유지하지 않고\n온전히 취업에만 집중하려면\n\n하루 최소 8~9시간은 \n취업 준비에 투자해야하고\n그 루틴을 3개월 이상 유지해야합니다.\n\n일을 하지 않는만큼\n그 시간을 취업에 쓴다는건\n레버리지니까요.", "d": "2025-11-07", "cat": "취업준비 전반 팁", "fav": false, "h": false}, {"c": "DS4HOLHkdBK", "u": "https://www.threads.com/@jickjin2025/post/DS4HOLHkdBK", "du": "threads.com/@jickjin2025/post/DS4HOLHkdBK", "t": "이직 준비자에게 추천할 퇴근 후 4시간 공기업 이직루틴", "at": "내가 이직 준비자라면 세울", "s": "퇴근 후 4시간 공기업 취업 루틴 1. 준비해야할 것이 자격증+NCS 라면 → 자격증 3H, NCS 1H 2. 준비해야할 것이 자격+어학+NCS 라면 → 자격증 2H, 어학 1H, NCS 1H 3. NCS만 준비한다면 → 하루는 의+수 4H, 하루는…", "b": "내가 이직 준비자라면 세울\n퇴근 후 4시간 공기업 취업 루틴\n\n1. 준비해야할 것이 자격증+NCS 라면\n→ 자격증 3H, NCS 1H\n\n2. 준비해야할 것이 자격+어학+NCS 라면\n→ 자격증 2H, 어학 1H, NCS 1H\n\n3. NCS만 준비한다면\n→ 하루는 의+수 4H, 하루는 문+자 4H\n\n이것도 정말 타이트하다.\n그렇지만 상황이 열악해도 최선은 다해야한다.", "d": "2025-12-30", "cat": "취업준비 전반 팁", "fav": false, "h": false}, {"c": "DOP6EO8Evnc", "u": "https://www.threads.com/@jickjin2025/post/DOP6EO8Evnc", "du": "threads.com/@jickjin2025/post/DOP6EO8Evnc", "t": "들었던 이직 사유 중 가장 화가 났던 사유", "at": "들었던 이직 사유 중 가장 화가 났던 사유", "s": "1~2년 전쯤 신입 여직원과 스몰 톡을 하다 이직 사유를 들었다. 대기업 L사를 2년 반 정도 다녔었는데 회식 때 전무가 뒤에서 껴안았다고 한다... 곧바로 바로 사표내고 이직 준비했다고해서 잘했다고는 말해줬지만 당사자가 당했을 감정을 감히 공감하는…", "b": "-들었던 이직 사유 중 가장 화가 났던 사유\n\n1~2년 전쯤 신입 여직원과\n스몰 톡을 하다 이직 사유를 들었다.\n\n대기업 L사를 2년 반 정도 다녔었는데\n회식 때 전무가 뒤에서 껴안았다고 한다...\n\n곧바로 바로 사표내고\n이직 준비했다고해서\n잘했다고는 말해줬지만\n\n당사자가 당했을 감정을\n감히 공감하는 말을 꺼내기 어려워\n다른 말을 아꼈다.\n\n취업을 도와주는 것도 중요하지만\n좋은 회사 문화를 만들도록\n선배가 노력하는 것도 너무 중요하다.", "d": "2025-09-06", "cat": "취업준비 전반 팁", "fav": false, "h": false}, {"c": "DPJgt6iEkAl", "u": "https://www.threads.com/@jickjin2025/post/DPJgt6iEkAl", "du": "threads.com/@jickjin2025/post/DPJgt6iEkAl", "t": "사람들이 잘 모르는 공공기관 채용 사이트들", "at": "취준생들 매번 사람인, 잡코리아 검색해도", "s": "새로운 건 잘 안나오지 않아? 새로운 취직, 경력쌓기 좋은 사이트 알려줄게 1. 잡알리오(공공기관 채용정보시스템) 공공기관 채용 A to Z 모두 알 수 있고 들어보지 못한 꿀단지 직무 여기 다있다. 2. 청년일경험 포털 전국의 공공기관/지자체 인턴…", "b": "취준생들 매번 사람인, 잡코리아 검색해도\n새로운 건 잘 안나오지 않아?\n\n새로운 취직, 경력쌓기 좋은 사이트\n알려줄게\n\n1. 잡알리오(공공기관 채용정보시스템)\n공공기관 채용 A to Z 모두 알 수 있고\n들어보지 못한 꿀단지 직무 여기 다있다.\n\n2. 청년일경험 포털\n전국의 공공기관/지자체 인턴, 기업 탐방,\n일 체험 프로그램 등\n학생 신분에서도 사무/행정 업무 체험할 수 있는\n최적의 공고 사이트야.\n\n3. 클린아이 잡플러스\n지방공공기관 통합채용정보 공개시스템\n수도권 뿐 아니라 지방의 공공일자리를 \n폭넓게 확인 가능한 곳이야.", "d": "2025-09-28", "cat": "취업준비 전반 팁", "fav": false, "h": false}, {"c": "DQJIDhriLMK", "u": "https://www.threads.com/@jickjin2025/post/DQJIDhriLMK", "du": "threads.com/@jickjin2025/post/DQJIDhriLMK", "t": "이직자 & 인턴 실전 취준 루틴", "at": "이직자 & 인턴 실전 취준 루틴", "s": "1. PM 7:30 ~ 8:30 (리셋 구간) → 씻고 밥 먹고, 30분은 완전 휴식. (하루의 리듬을 끊고 ‘공부모드’로 전환하는 리셋 타임) 2. PM 8:30 ~ 10:30 (몰입 구간) → 자소서 / NCS시험 공부 / 기업분석 중 택1. (…", "b": "이직자 & 인턴 실전 취준 루틴\n\n1. PM 7:30 ~ 8:30 (리셋 구간)\n→ 씻고 밥 먹고, 30분은 완전 휴식.\n(하루의 리듬을 끊고 ‘공부모드’로 전환하는 리셋 타임)\n\n2. PM 8:30 ~ 10:30 (몰입 구간)\n→ 자소서 / NCS시험 공부 / 기업분석 중 택1.\n('여러개' 보다 '하나만 꾸준히)\n\n3. PM 10:30 ~ 11:30 ㅣ 피드백 & 회복 구간\n→ 내용 정리 & 다음날 계획 (한 줄 요약 3개)\n→ 스트레칭, 산책 중 택1\n(집중력 유지 가능할 경우 부족분 보충)", "d": "2025-10-23", "cat": "동기부여와 멘탈관리", "fav": false, "h": false}, {"c": "DSPDkshko8z", "u": "https://www.threads.com/@jickjin2025/post/DSPDkshko8z", "du": "threads.com/@jickjin2025/post/DSPDkshko8z", "t": "공기업 2개가 하나로 통합되면 어떤 일이 벌어질까?", "at": "공기업 2개가 하나로 통합되면 어떤 일이 벌어질까?", "s": "코레일, SR 준비하고 있었던 사람들은 고민이 많을 것이다. 정부에서도 계속 주시하고 있고 실질적인 추진 내용이 기사로 나오는걸 보니, 진행은 되는거 같다. 통합의 배경과 면접 준비할 때 필요한 내용을 알기 쉽게 설명해줄게! (댓글 참고) 1. 최초…", "b": "공기업 2개가 하나로 통합되면 어떤 일이 벌어질까?\n\n코레일, SR 준비하고 있었던 사람들은 \n고민이 많을 것이다.\n\n정부에서도 계속 주시하고 있고 \n실질적인 추진 내용이 기사로\n나오는걸 보니, 진행은 되는거 같다.\n\n통합의 배경과 면접 준비할 때 필요한 내용을\n알기 쉽게 설명해줄게!\n\n(댓글 참고)\n\n1. 최초에 SR이 설립된 이유는 \n'KTX와의 경쟁을 통한 철도 서비스 개선'이다.\n사업을 1개 회사가 독점하고 있을 경우 \n생기는 부작용(서비스 품질 저하, 철도 요금 통제 어려움)을\n막기 위한 조치였고 취지는 좋아보였다.\n\n2. 그러나 실제 SRT가 출범되고 보니, 부작용이 많았다.\n대표적으로 중복비용 발생이 있다.\nSR이 출범하면서 SRT 전용 선로와 차량기지, \n신호시설 등을 신설한 것이 아니라 \n'기존의 코레일 철도 인프라'를 빌려쓰는 방식이었기 때문이다.\n\n즉, A식당에서 일하던 직원이 \n\"이제 내 식당 차릴게!\"선언하고 일을 그만뒀는데 \n자기 일하던 A식당 간판 옆에 B식당 간판만 하나 더 달고\n그 안의 테이블과 의자는 공유해서 사용하고\n음식 담는 접시, 수저만 새로 사서 세팅한 것과 같은 이치다.\n\n3. 기재부의 시각으로 볼 때는 낭비가 너무 심한 것이다.\n(정부 추정치는 낭비 예산 406억)\n두 회사가 똑같은 철도 인프라를 이용해서 \n고객을 실어나르는건데\n안전 대책도 2개, 마케팅/홍보 비용도 2배, \n발권/예약 시스템과 어플도 2개,\n그럼 그걸 유지하기 위한 조직과 비용도 2배씩 투입된다. \n\n'우린 서로 다른 회사잖아!' 라고 외쳐도 \n정부 입장에선 결국 이런 구조가 \n국민에게 손해라고 결론 짓는 것이다.\n\n4. 고객 측면에서는 좌석 활용 효율 문제와 예매, \n환불의 불편함이 있었다.\n나는 돈을 내고 A에서 C로 가는 기차를 이용하고 싶은데 \n2개 회사가 철로를 운영하고 있으므로 \n중간 B에서 '환승' 과정을 거치는 경우가 생기며 \n예매도 따로따로, 환불도 따로따로 해야하는 것이다.\n\n5. 여기까지만 보면 통합이 당연해보인다.\n그러나 우리는 취준생이니까 면접 대비용으로\n객관적, 논리적 시각으로 바라보자.\n\n통합했을 때 직관적으로 생각나는 단점은\n1. 철도요금 인상\n2. 철도 파업했을 때의 리스크\n정도이다.\n\n1) 철도요금 인상은 철도산업이 다시 독점체제가\n되므로 제기될 수 있는 문제인데, 통합과 관계없이\n철도 요금인상은 되어야하고 다시 이야기가 나올 것이다.\n(팩트 : 현재 철도요금 14년 째 동결 중)\n\n2) 철도노조 파업\n사실 이게 제일 큰 문제 같은데 파업시\n대체 인력과 대체 교통수단을 마련해야할 것이다.\n노조에 포함되어 있지 않은 대체 인력, 퇴직자 인력\n등을 활용할 수도 있고, 버스/항공 증편이 보조수단으로\n활용될 수도 있다.\n\n6. 그러면 면접에서 고용 변화에 대해서는\n얘기해도 되는걸까?\n면접관이 현재 얼마나 체감하고 있을지는\n알 수 없지만 너무 민감한 분위기라면\n굳이 먼저 언급하진 않아도 될거라 생각한다.\n\n어디까지나 회사에 대한 관심도와 준비성, 논리력을\n평가하는 것이므로 팩트+나의 논리에 집중하는 것이 좋다.\n\n또 공기업 조직 특성상 이번 통합이 선례로 자리 잡으면\n앞으로 있을 발전 공기업, 주거 공기업 통합시에도\n비슷한 흐름으로 갈 가능성이 있으니까 \n관련 기업 지원자들은 이번 통합 결과를 주시해보자!", "d": "2025-12-14", "cat": "면접 준비 팁", "fav": false, "h": false}, {"c": "DOFly0siapQ", "u": "https://www.threads.com/@jickjin2025/post/DOFly0siapQ", "du": "threads.com/@jickjin2025/post/DOFly0siapQ", "t": "이직 관련 면접 질문이 나올 때 가급적 피하면 좋은 퇴사사유들", "at": "이직 관련 면접 질문이 나올 때 가급적 피하면 좋은 퇴사사유들", "s": "1. 워라밸이 좋은 회사로 옮기고 싶어서 → 회사 입장에서 로열티가 보이지 않음 2. 연봉이 높고 복지가 좋은 회사로 가고싶어서 → 1번과 동일 사유 3. 부서내 인간관계에서 어려움이 있어서 → 어  분명히 있어요.\n\n'어차피 정년까지 다닐건데 뭐~'\n라는 분위기도 조성되어 있습니다.\n입사 후에도 문제 없으니 지원하세요!\n\n내가 30대라서 쓰는 글은\n절대 아님!!!", "d": "2025-12-07", "cat": "취업준비 전반 팁", "fav": false, "h": false}, {"c": "DbxmUniCgOA", "u": "https://www.threads.com/@jickjin2025/post/DbxmUniCgOA", "du": "threads.com/@jickjin2025/post/DbxmUniCgOA", "t": "지금 취준하는 학생들에게 하고싶은 말", "at": "지금 취준하는 학생들에게", "s": "하고 싶은 말 대우가 다소 부족하더라도 건강한 조직 문화가 있는 회사로 취직하는 걸 권한다 첫 회사는 자신의 직업관, 세상에 대한 시각에 크나큰 영향을 끼친다 첫 회사에서 생긴 일, 인연으로 인해 상처를 지닌 채 자신만의 동굴로 들어가거나 운명이 바…", "b": "지금 취준하는 학생들에게\n하고 싶은 말\n\n대우가 다소 부족하더라도\n건강한 조직 문화가 있는 회사로\n취직하는 걸 권한다\n\n첫 회사는 자신의 직업관, 세상에 대한 시각에\n크나큰 영향을 끼친다\n\n첫 회사에서 생긴 일, 인연으로 인해\n\n상처를 지닌 채 자신만의 동굴로 들어가거나\n운명이 바뀌어 날개를 펴는 경우를 종종 보았다", "d": "2026-08-08", "cat": "취업준비 전반 팁", "fav": false, "h": false}, {"c": "DcOPqchD3bR", "u": "https://www.threads.com/@jickjin2025/post/DcOPqchD3bR", "du": "threads.com/@jickjin2025/post/DcOPqchD3bR", "t": "처음 공기업 면접 준비하는 학생들이 흔히 하는 실수", "at": "처음 공기업 면접 준비하는 학생들이 흔히 하는 실수", "s": "(확증 편향) 처음 면접 준비하는 취준생들은 예상, 기출 면접질문 20-30개를 뽑아서 답변 스크립트를 준비하는 경우가 많은데 이때 스크립트를 달달 외우면 확증 편향 심리가 발동되기 쉽다 자신에게 유리한 정보만 선택적으로 받아들이는 것인데 면접관의 …", "b": "처음 공기업 면접 준비하는 학생들이 흔히 하는 실수\n(확증 편향)\n\n처음 면접 준비하는 취준생들은\n예상, 기출 면접질문 20-30개를 뽑아서\n답변 스크립트를 준비하는 경우가 많은데\n\n이때 스크립트를 달달 외우면\n확증 편향 심리가 발동되기 쉽다\n\n자신에게 유리한 정보만 선택적으로 받아들이는 것인데\n면접관의 질문 맥락 중 핵심 단어 1-2개를 듣고\n\"아, 내가 준비한 그 질문이구나\"라고 해석하는 것이다\n\n그래서 외운 답변을 그대로 말하면\n면접관의 의도와 다른 답변으로 흘러가고\n이것이 큰 감점요소가 될 수 있다\n\n이런 참사를 방지하려면 아래의 두가지를 연습해보자\n\n1. 문장 전체가 아닌 핵심 뼈대(키워드)만 기억한다\n\n질문이 나왔을 때 핵심 키워드를 적고\n살을 붙이면서 말하는 연습을 한다. \n이때 토시가 바뀌거나 문장 구조가 달라져도 괜찮다\n\n스터디원과 롤플레잉을 하거나 AI에게\n예상치 못한 질문을 던지게 한 후에\n내가 외운 키워드를 조합해 재빨리 답변하는 연습을 한다\n\n처음엔 다소 급조된 느낌이어도 괜찮다\n계속 연습해서 다듬으면 임기응변 능력이 향상되면서\n부드럽고 안정적인 답변을 만들 수 있다\n\n2. 질문의 의도와 핀트가 다른 것을 스스로 알게 됐을 때,\n또는 면접관이 해당 부분을 지적했을 때\n시간을 버는 문장을 연습한다(쿠션어, 재확인하기)\n\n쿠션어 : 질문하신 부분에 대해 정확히 같은 경험은 없지만, 제 ~~한 경험이 있는데 이걸로 답변해도 되겠습니까?\n\n재확인 : 방금 질문하신 의도가 A를 의미하는 게 맞으실까요? 제가 이해한게 맞다면 ~~\n\n2번의 핵심은 내 첫 답변이 면접관의 의도와 다르다는 걸\n알아채고 이제 다시 답변하겠다는 것을 알려주는 것이다\n\n1) 질문의 의도와 다른 스크립트 그대로 답변 \n-> 바로 평가 감점.\n2) 질문의 의도와 다른 답변임을 인지하고\n 정정 답변을 하려고 함.\n-> 평가 보류(일단 들어봄) \n\n이렇게 면접 상황이 흘러갈 가능성이 높다", "d": "2026-08-19", "cat": "면접 준비 팁", "fav": false, "h": false}, {"c": "DSKaLLgkRq0", "u": "https://www.threads.com/@jickjin2025/post/DSKaLLgkRq0", "du": "threads.com/@jickjin2025/post/DSKaLLgkRq0", "t": "NCS 필기시험, 탈락자는 모르고", "at": "NCS 필기시험, 탈락자는 모르고", "s": "합격자만 아는 공부 접근 방식 시간 관리 탈락자 : 시간 안에 다 풀려고 노력한다. 합격자 : 다 푸는 것은 절대 불가능하다. 재능 탈락자 : IQ 테스트와 비슷해서 재능이 필요하다. 합격자 : 문제 푸는 스킬이 필요하다. 문제풀이 탈락자 : 문제 …", "b": "NCS 필기시험, 탈락자는 모르고\n합격자만 아는 공부 접근 방식\n\n시간 관리\n탈락자 : 시간 안에 다 풀려고 노력한다.\n합격자 : 다 푸는 것은 절대 불가능하다.\n\n재능\n탈락자 : IQ 테스트와 비슷해서 재능이 필요하다.\n합격자 : 문제 푸는 스킬이 필요하다.\n\n문제풀이\n탈락자 : 문제 하나하나에 집중한다.\n합격자 : 풀 문제, 안 풀 문제를 빠르게 결정한다.", "d": "2025-12-12", "cat": "취업준비 전반 팁", "fav": false, "h": false}, {"c": "DN66opBktnr", "u": "https://www.threads.com/@jickjin2025/post/DN66opBktnr", "du": "threads.com/@jickjin2025/post/DN66opBktnr", "t": "답변 못하면 탈락하기 쉬운 인성 면접 질문 7가지", "at": "답변 못하면 탈락하기 쉬운 인성 면접 질문 7가지", "s": "1. 경쟁사도 많은데 왜 이 회사를 선택했나요? 2. 갈등 상황 해결 못한 적은 없나요? 3. 전공과 직무가 다른 약점을 어떻게 극복하실건가요? 4. 자기 소개에서 말하지 않은 본인에 대해 알려주세요 5. 입사 후 제일 먼저 하고싶은 일이 뭔가요? …", "b": "-답변 못하면 탈락하기 쉬운 인성 면접 질문 7가지\n\n1. 경쟁사도 많은데 왜 이 회사를 선택했나요?\n\n2. 갈등 상황 해결 못한 적은 없나요?\n\n3. 전공과 직무가 다른 약점을 어떻게 극복하실건가요?\n\n4. 자기 소개에서 말하지 않은 본인에 대해 알려주세요\n\n5. 입사 후 제일 먼저 하고싶은 일이 뭔가요?\n\n6. 본인의 별명이 무엇이고 이유가 뭔가요?\n\n7. 본인이 생각하기에 좋은 동료란 무엇인가요?", "d": "2025-08-29", "cat": "면접 준비 팁", "fav": false, "h": false}, {"c": "DOnrIKwEm1y", "u": "https://www.threads.com/@jickjin2025/post/DOnrIKwEm1y", "du": "threads.com/@jickjin2025/post/DOnrIKwEm1y", "t": "알바 경험이 취준+회사생활에 유리한 이유", "at": "알바 경험이 취준+회사생활에 유리한 이유", "s": "1. 일을 해보며 직업 가치관을 얻게 된다. 2. 일하면서 내가 몰랐던 나 자신을 알게 된다. 3. 낯선 사람과도 일하는 법을 배운다. 4. 돈보다 중요한 인생 교훈을 얻게 된다. 5. 피해야할 인간의 유형을 알게 된다. 6. 학교에선 겪기 드문 유…", "b": "-알바 경험이 취준+회사생활에 유리한 이유\n\n1. 일을 해보며 직업 가치관을 얻게 된다.\n2. 일하면서 내가 몰랐던 나 자신을 알게 된다.\n3. 낯선 사람과도 일하는 법을 배운다.\n4. 돈보다 중요한 인생 교훈을 얻게 된다.\n5. 피해야할 인간의 유형을 알게 /@jickjin2025/post/DRzVzTVAiGy", "du": "threads.com/@jickjin2025/post/DRzVzTVAiGy", "t": "9년차 공기업 현직자가 지켜봤던", "at": "9년차 공기업 현직자가 지켜봤던", "s": "관리자에게 이쁨 받았던 신입사원 1. 자기 선에서 할 수 있는 최대한을 해보고 질문 → 사내규정, 공문 등 활용해서 공부, 업무에 적용 후 질문 2. 일을 일로써 받아들인다 → 업무에 대한 피드백을 감정적으로 받아들이지 않음 3. 태도가 좋고 인사를…", "b": "- 9년차 공기업 현직자가 지켜봤던\n관리자에게 이쁨 받았던 신입사원\n\n1. 자기 선에서 할 수 있는 최대한을 해보고 질문\n→ 사내규정, 공문 등 활용해서 공부, 업무에 적용 후 질문\n\n2. 일을 일로써 받아들인다\n→ 업무에 대한 피드백을 감정적으로 받아들이지 않음\n\n3. 태도가 좋고 인사를 정말 잘한다\n→ 마주치거나 업무 통화를 할 때 기억에 남을 정도\n\n4. 이해한 것과 모르는 것을 구분할 줄 안다\n→ 알겠습니다 남발하지 않고, 필요한 부분은 부가질문으로\n정확히 이해하려고 노력한다\n\n1~4번이 되려면 신입사원의 기본도 중요하지만\n선배들의 세심한 코칭과 팀 분위기도 중요했다", "d": "2025-12-03", "cat": "취업준비 전반 팁", "fav": false, "h": false}, {"c": "DQOj1mYEosS", "u": "https://www.threads.com/@jickjin2025/post/DQOj1mYEosS", "du": "threads.com/@jickjin2025/post/DQOj1mYEosS", "t": "취준생 상담 중 질문 공유", "at": "취준생 상담 중 질문 공유", "s": "Q. 공기업 계약직, 체험형 인턴 둘다 기회가 있다면 어떤게 더 좋은가요? 답변 : 정규직을 바라봐야하는 입장에서는 체험형 인턴이 낫다고 봅니다. 계약직(특히 육아휴직대체)은 업무 강도/난이도가 현직자 수준일 가능성이 높아요. 많은 걸 배울 수 있으…", "b": "취준생 상담 중 질문 공유\nQ. 공기업 계약직, 체험형 인턴 둘다 기회가 있다면\n어떤게 더 좋은가요?\n\n답변 : 정규직을 바라봐야하는 입장에서는\n체험형 인턴이 낫다고 봅니다.\n\n계약직(특히 육아휴직대체)은\n업무 강도/난이도가 현직자 수준일 가능성이 높아요.\n\n많은 걸 배울 수 있으나, \n그만큼 에너지 소비도 크다는거..!\n\n인턴으로 고정 수입 & 취업준비에\n더 집중하는게 좋다고 봅니다!", "d": "2025-10-25", "cat": "취업준비 전반 팁", "fav": false, "h": false}, {"c": "DcvuD5pDlq5", "u": "https://www.threads.com/@jickjin2025/post/DcvuD5pDlq5", "du": "threads.com/@jickjin2025/post/DcvuD5pDlq5", "t": "민원이 많은 VS 적은 공공기관(사무직편)", "at": "민원이 많은 VS 적은 공공기관(사무직편)", "s": "이공계 기술직 편을 전에 썼는데 이번엔 사무직편을 써보려고 한다. 내 말이 절대적이지 않으며 모든 기업의 특징에 대해 다 알 수 없고 부서마다 다르다. 관점을 참고한다는 측면에서 읽으면 좋겠다 (댓글에 1. 민원이 많은 회사들 주로 개인의 당장의 이…", "b": "-민원이 많은 VS 적은 공공기관(사무직편)\n\n이공계 기술직 편을 전에 썼는데\n이번엔 사무직편을 써보려고 한다.\n\n내 말이 절대적이지 않으며\n모든 기업의 특징에 대해 \n다 알 수 없고 부서마다 다르다.\n\n관점을 참고한다는 측면에서 읽으면 좋겠다\n\n(댓글에\n\n1. 민원이 많은 회사들\n\n주로 개인의 당장의 이익(돈, 혜택, 주거, 보험 등)과\n연관이 있는 일을 한다\n\n건강보험공단\n근로복지공단\n자산관리공사\n주택금융공사\n소상공인시장진흥공단\n\n특히 부동산 정책, 규제 강화/완화,\n지원금 지급 조건이 바뀔 때마다\n이 기관들의 민원 강도, 숫자가 폭증하므로\n정부 정책과도 연관이 있다\n\n또 지점이 도심지에 있는 곳은\n국민이 방문하기 편리해야한다는 뜻이므로\n이 역시 민원량이 많은 것과 연관이 있다\n\n2. 민원이 적거나 없는 회사들\n\n개인을 상대하지 않고 기업과 거래하거나\n정부 정책을 대행하는 기관들이다\n\n한국무역보험공사\n한국예탁결제원\n국가철도공단\n한국인터넷진흥원\n한국산업단지공단\n4대 항만공사\n\n3. 취업 준비생 입장에서의 결론\n\n내가 하는 업무가 국민을 상대할지\n기업을 상대할지, 정부 기관을 상대할지를\n생각하고 산업과 기관을 정해보자\n \n완벽하게 피하진 못하더라도\n상대적으로 강도가 덜 한 곳에서 근무할 수 있다\n물론 부서 BY 부서가 있으니 유의!", "d": "2026-09-01", "cat": "취업준비 전반 팁", "fav": false, "h": false}, {"c": "DOVJbRtDcrH", "u": "https://www.threads.com/@jickjin2025/post/DOVJbRtDcrH", "du": "threads.com/@jickjin2025/post/DOVJbRtDcrH", "t": "공기업 합격 권장 스펙 정리 2편", "at": "공기업 합격 권장 스펙 정리 2편", "s": "3. 자격증 기술직 : 기사/산업기사 자격증 취득(기업에 맞춰서 준비) 사무직 : 한국사, 컴활, 정보처리기사 등 쉬운 것부터 취득 금융공기업 준비자는 여유된다면 전산회계 취득한 사람들도 있음 이것 역시 기업별 채용공고를 확인하고 취업 커뮤니티에서 …", "b": "-공기업 합격 권장 스펙 정리 2편\n\n3. 자격증\n기술직 : 기사/산업기사 자격증 취득(기업에 맞춰서 준비)\n사무직 : 한국사, 컴활, 정보처리기사 등 \n쉬운 것부터 취득\n\n금융공기업 준비자는 여유된다면\n전산회계 취득한 사람들도 있음\n\n이것 역시 기업별 채용공고를 확인하고\n취업 커뮤니티에서 해당 기업 합격자 스펙을\n한번 더 확인.", "d": "2025-09-08", "cat": "취업준비 전반 팁", "fav": false, "h": false}, {"c": "DRt1uVTkqqg", "u": "https://www.threads.com/@jickjin2025/post/DRt1uVTkqqg", "du": "threads.com/@jickjin2025/post/DRt1uVTkqqg", "t": "면접관을 깜짝 놀라게 하는 시야를 갖춘", "at": "면접관을 깜짝 놀라게 하는 시야를 갖춘", "s": "지원자가 되려면 '거시경제'를 알아야 한다. 공기업/공공기관은 정부의 정책뿐 아니라 기업/경제 상황에 큰 영향을 받는다. 단순 뉴스 정보의 소비, 나열이 아닌 거시경제 흐름과 내 생각/직무를 곁들여 말할 수 있는 사람은 차별화된 지원자가 된다. SK…", "b": "면접관을 깜짝 놀라게 하는 시야를 갖춘 \n지원자가 되려면 '거시경제'를 알아야 한다.\n\n공기업/공공기관은\n정부의 정책뿐 아니라 기업/경제 상황에 \n큰 영향을 받는다.\n\n단순 뉴스 정보의 소비, 나열이 아닌\n거시경제 흐름과 내 생각/직무를 곁들여\n말할 수 있는 사람은 차별화된 지원자가 된다.\n\nSK하이닉스가 국내 AI 메모리 공장을 증설할 경우\n공기업에 장기적으로 어떤 영향이 미칠지\n예시를 들어줄게.\n\n이런 글 어디서도 본 적 없을걸? (댓글 참고)\n\n1. 현재 SK하이닉스의 AI메모리 증설은\n'공장을 추가로 짓는다' 수준이 아닌 국가급 프로젝트다.\n예시로 용인 반도체 클러스터에 필요한 전력량은\n16GW 인데, 이는 면적당 전력기준으로 서울시 전체 전력량의 32배다.\n이점을 감안하고 공기업별 사업 추진계획에 대해 예상해보겠다.\n\n2. 한전 : 대규모 전력 수요를 감당하기 위해\n한국전력공사에서는 변전소, 송전선로 신설 등 대규모 전력 인프라를\n구축하기 위한 공급계획 관련 업무가 진행된다.\n기존 전력망과는 비교도 안되는 숫자의 송전선로가 깔려야하고 그러려면\n부지 확보, HVDC 추가 증설 검토, 본사주관 TF팀 신설 등등 관련 업무가 많이 늘어난다.\n\n3. 발전 6사 : 한전의 전력 구매를 감당하기 위해 당연히\n발전사에선 추가 전력 생산이 필요하고 이는 원전 가동률 증가에 대한 재검토 뿐 아니라 LNG, 재생에너지 발전량 증대 등 모든 수단을 강구할 것이다.\n발전사는 SMP(계통한계비용)가 높을수록 수익성이 커지므로 이 상황을 잘 활용하려고 할 것이다.\n\n4. 가스공사 : LNG 발전 비중이 늘어날 경우, 한국가스공사에서는 자연히 LNG가스 수입량을 늘리고 수입망을 다변화하려는 노력을 할 것이다. 여기에 대한 외교적 협상도 필요, 이미 시행하고 있고(올해 8월 미국과 330만톤 미국산 LNG 도입 계약 체결) 가스 배관망 추가 구축 같은 요소도 검토할 것이다.\n도시가스공사에서는 공단 지역에 직접 가스공급을 위한 공급망도 검토가 필요할 수도 있다.\n\n5. 지역기반의 각 공공기관 : 1번에서 말했듯 공장 수준이 아닌 산업단지, 대규모 공단이 조성될 것이다. \n토지를 매입하고 건설하는데 필요한 인허가, 설계 검토, 지자체와의 협력도 필요하다.\n해당 지역의 도시공사는 물론이고\n국토부, 도청/시청/구청의 토지개발과/건축과, 환경공단, 시설공단, 산업단지공단 등등 부지에 산업단지가 들어서고 출입하는 모든 요소(도로, 수도, 가스, 전기, 인력, 철도, 인근 공공시설 등등)를 주관하는 공공기관들이 협력한다.\n\n6. 이런 식으로 확장해나가면 끝도 없이 많다.\n선박, 건설, 교통, 상하수도 등 연관된 공기업을 일일이 열거하기도 어려울정도. (펩공정 관련 수자원공사의 수처리, 산업단지 인근 주거지 확보 등은 글이 길어 다 쓰지도 않았다)\n\n7. 마무리 : 경제 뉴스에 보도된 기사를 내 직무 관련 산업 분야가 아니라고 무심코 넘기는 것이 아닌 거시적인 관점에서 파악해서 내 산업, 직무에 미치는 영향을 생각해보자. 쉽지는 않고 꾸준한 독서와 깊은 사고력이 필요하다. 당장 시행될 일들이 아닌 예상, 전망 예측이라 하더라도 현실성이 충분히 있게 사고할 수 있다면, 면접관을 놀라게 하는 시야를 갖춘 지원자로 보일 것이다.", "d": "2025-12-01", "cat": "면접 준비 팁", "fav": false, "h": false}, {"c": "DQttfhTjtpm", "u": "https://www.threads.com/@jickjin2025/post/DQttfhTjtpm", "du": "threads.com/@jickjin2025/post/DQttfhTjtpm", "t": "취업 정보가 없는 회사의 면접 준비방법", "at": "취업 정보가 없는 회사의 면접 준비방법", "s": "취업 정보가 없는 이유는 2가지이다 1. 회사 기술력이 너무 높거나 기밀인 경우 (원전, 방산, 연구기관 등) 2. 회사의 규모가 작은 경우 (출연기관, 재단법인 등) 1번 → 알리오 공시, 해당 회사 사업보고서 검색 2번 → 00회사 사업계획서, …", "b": "-취업 정보가 없는 회사의 면접 준비방법\n\n취업 정보가 없는 이유는 2가지이다\n\n1. 회사 기술력이 너무 높거나 기밀인 경우\n(원전, 방산, 연구기관 등)\n\n2. 회사의 규모가 작은 경우\n(출연기관, 재단법인 등)\n\n1번 → 알리오 공시, 해당 회사 사업보고서 검색\n\n2번 → 00회사 사업계획서, 업무추진현황 등을 검색", "d": "2025-11-06", "cat": "면접 준비 팁", "fav": false, "h": false}, {"c": "DOBTpwgEp0W", "u": "https://www.threads.com/@jickjin2025/post/DOBTpwgEp0W", "du": "threads.com/@jickjin2025/post/DOBTpwgEp0W", "t": "합격자와 탈락자의 결정적인 자소서 차이점", "at": "합격자와 탈락자의 결정적인 자소서 차이점", "s": "1. 스토리 흐름 차이 합격자 : 구조화 되어있음(STAR or 경험-결과-적용) vs 탈락자 : 상황에 대한 나열식 2. 문장 길이와 는\n소중한 시간에 꼭 해보면 좋을 질문을 넣어봤다.\n\n가장 먼저 산업군, 참여할 기업을 \n무조건 정하고 가야한다.\n\n1. 실제로 신입사원으로 입사해서 \n가장 많이 하는 일(기본적 업무, 메인 업무)\n→ 내 일이 될 예정이다.\n\n2. 실제로 업무 현장에서 겪는 어려운 상황들\n→ 현장의 어려움을 듣고 나는 잘 해결할 수 있는\n사람으로 브랜딩해야 한다(자소서, 면접 차별화)\n\n3. 입사를 위해 준비해야할 것들\n→ 취업을 위한 자격증+실제로 업무에 필요한\n자격증. 역량. 마인드\n\n4. 업무 안에서 구체적으로 어떤 소통 상황이\n발생하는지\n→ 소통 능력을 강조하는 회사가 많은데\n어떤 상황, 어떤 방식의 소통이 필요한지 질문.", "d": "2026-01-20", "cat": "자기소개서 준비 팁", "fav": false, "h": false}, {"c": "DOpuKREkqMT", "u": "https://www.threads.com/@jickjin2025/post/DOpuKREkqMT", "du": "threads.com/@jickjin2025/post/DOpuKREkqMT", "t": "고스펙자를 당황시켰던 면접장 킬러 질문", "at": "고스펙자를 당황시켰던 면접장 킬러 질문", "s": "1. 이렇게 스펙이 좋은데 왜 우리 회사를 선택했나? → 타 회사에서도 충분히 경쟁력있는 인재는 자사에 대한 로열티를 확인 2. 본인에게 있어 가장 큰 실패 사례는 무엇인가? → 제대로 실패해본 경험이 없는 온실 속 화초인가, 산전수전 다 겪은 잡초…", "b": "-고스펙자를 당황시켰던 면접장 킬러 질문\n\n1. 이렇게 스펙이 좋은데 왜 우리 회사를 선택했나?\n→ 타 회사에서도 충분히 경쟁력있는 인재는 \n자사에 대한 로열티를 확인\n\n2. 본인에게 있어 가장 큰 실패 사례는 무엇인가?\n→ 제대로 실패해본 경험이 없는 온실 속 화초인가,\n산전수전 다 겪은 잡초인가?\n\n3. 본인 이력에서 가장 후회되는 경험을 뽑고, 이유를 말해보세요\n→ 경험에 대한 객관적/비판적 사고 능력\n\n4. 다른 회사에서도 합격할 가능성이 높을텐데,\n우리 회사에서만 하고 싶은 일이 있는가?\n→ 채용 이후 이직할 가능성까지 확인하고 싶은 의도, 목표 일치도", "d": "2025-09-16", "cat": "면접 준비 팁", "fav": false, "h": false}, {"c": "DNtxY3w3hGm", "u": "https://www.threads.com/@jickjin2025/post/DNtxY3w3hGm", "du": "threads.com/@jickjin2025/post/DNtxY3w3hGm", "t": "실제로 공기업 임원(최종) 면접에서", "at": "실제로 공기업 임원(최종) 면접에서", "s": "자주 나왔던 질문 10개 1. 자기소개 해보세요 2. 까다로운 고객 응대 경험에 대해 말해보세요 3. 입사하게 되면 전국단위 순환근무인데 괜찮겠어요? 4. 성공이나 실패의 경험으로 얻은 교훈이 있나요? 5. 민원인을 응대해본 경험이 있나요? 6. 4…", "b": "실제로 공기업 임원(최종) 면접에서\n자주 나왔던 질문 10개\n\n1. 자기소개 해보세요\n2. 까다로운 고객 응대 경험에 대해 말해보세요\n3. 입사하게 되면 전국단위 순환근무인데 괜찮겠어요?\n4. 성공이나 실패의 경험으로 얻은 교훈이 있나요?\n5. 민원인을 응대해본 경험이 있나요?\n6. 4차 산업혁명 관련 회사가 나아가야 할 방향을 말해보세요\n7. 공기업의 정의와 본인의 생각을 말해보세요\n8. 자신을 뽑아야 하는 이유를 말해주세요\n9. 입사 후 포부를 말해보세요\n10. 친구들이 생각하기에 당신은 어떤 친구인가요?", "d": "2025-08-23", "cat": "면접 준비 팁", "fav": false, "h": false}, {"c": "Dc5l01Rik2Q", "u": "https://www.threads.com/@jickjin2025/post/Dc5l01Rik2Q", "du": "threads.com 전자라고 생각한다. 서류 전형을 통과 못하면, NCS 시험 칠 기회조차 안 주어지기 때문. 만약 당장 내년 상반기 정규직을 노려야한다면 하루 10시간 이상 공부해서 병행하면 좋겠다.", "b": "-스펙 준비가 먼저? VS NCS 준비가 먼저?\n\n당연히 전자라고 생각한다.\n\n서류 전형을 통과 못하면, \nNCS 시험 칠 기회조차 안 주어지기 때문.\n\n만약 당장 내년 상반기 정규직을 \n노려야한다면\n\n하루 10시간 이상 공부해서 \n병행하면 좋겠다.", "d": "2025-12-28", "cat": "자기소개서 준비 팁", "fav": false, "h": false}, {"c": "DQNvVdBEV5p", "u": "https://www.threads.com/@jickjin2025/post/DQNvVdBEV5p", "du": "threads.com/@jickjin2025/post/DQNvVdBEV5p", "t": "면접 스터디 진행시 유의 할 점", "at": "면접 스터디 진행시 유의 할 점", "s": "1. 같은 취준생끼리 면접 평가는 정확도 측면에서 실제 취업에 크게 도움은 안된다. 2. 그럼에도 스터디를 하는 이유는 '내가 준비해왔던 것의 검증'이 필요하기 때문이다. 3. 그러므로 사공이 많거나, 역량 높은 스터디원이 없다면 이탈하는 것이 면접…", "b": "면접 스터디 진행시 유의 할 점\n\n1. 같은 취준생끼리 면접 평가는 정확도 측면에서\n실제 취업에 크게 도움은 안된다.\n\n2. 그럼에도 스터디를 하는 이유는\n'내가 준비해왔던 것의 검증'이 필요하기 때문이다.\n\n3. 그러므로 사공이 많거나, 역량 높은 스터디원이 없다면\n이탈하는 것이 면접 준비에 나을 수도 있다.", "d": "2025-10-25", "cat": "면접 준비 팁", "fav": false, "h": false}, {"c": "DczzeF6EiOj", "u": "https://www.threads.com/@jickjin2025/post/DczzeF6EiOj", "du": "threads.com/@jickjin2025/post/DczzeF6EiOj", "t": "한국전력공사, 삼성전자/SK하이닉스에", "at": "한국전력공사, 삼성전자/SK하이닉스에", "s": "5년치 전기료 선납 제안 이 기사를 보고 정부가 대기업 괴롭힌다고 악플을 많이 달고 있네 공공기관 취업준비생 입장에서 이 기사를 어떻게 바라봐야하는지 객관적으로 분석해볼게 이런 취업 인사이트는 어디서도 볼 수 없을거라 확신해. 공기업 취준생들 안 보…", "b": "- 한국전력공사, 삼성전자/SK하이닉스에\n5년치 전기료 선납 제안\n\n이 기사를 보고 정부가 대기업 괴롭힌다고 \n악플을 많이 달고 있네\n\n공공기관 취업준비생 입장에서 \n이 기사를 어떻게 바라봐야하는지\n객관적으로 분석해볼게\n\n이런 취업 인사이트는 \n어디서도 볼 수 없을거라 확신해. \n공기업 취준생들 안 보면 후회할걸?\n\n댓글에 시작\n\n1. 먼저 SOC(도로, 철도, 항만, 주택, 수도)와 \n에너지 분야(한전, 발전사 등) 공공기관들이\n대규모 인프라 건설 프로젝트를 \n어떻게 시작하는지 살펴봐야 한다\n\n먼저 프로젝트의 '원인 제공 주체'를\n알아야 하는데 2가지로 나뉜다.\n\n1) 원인 제공 주체가 공공기관 자체인 경우\n\n외부 요인이 아닌 기관 자체에서 세운\n인프라 수요와 계획에 따른 \n회사의 이익 창출의 일환으로 판단.\n→ 매년 정해진 기관의 자체 예산에 따라 프로젝트 진행\n\n그런데 원인 제공 주체가 외부일 경우는?\n\n2) 원인 제공 주체가 외부인 경우\n\n기관 입장에선 당초 인프라 확장 계획이 없었는데\n외부의 고객(정부, 민간, 기업)의 요청에 따라 \n프로젝트를 시행해야할 경우이다\n\n→ 고객의 요청에 의해 인프라를 확충해야하므로\n고객이 프로젝트이 필요한 예산을 전액 부담.\n이것을 '수탁사업' 또는 '원인자부담 사업' 이라고 한다\n\n예를 들어 택지개발하면서 부지에\n도로를 다시 깔아야한다? \n→ 택지개발 주체(LH, 지자체)가 돈을 부담\n\n아파트 재개발/재건축 인근 부지의 송전탑을 \n지중화해서 없애고 싶다? \n→ 재개발 주체(민간, 조합)가 돈을 부담\n\n반도체 공장을 지어서 수도, 전력망의\n확장이 필요하다? \n→ 공장 짓는 주체(삼성, SK하이닉스)가 부담\n\n그러면 이렇게 외부 고객 요청에 따라\n인프라를 지을 때\n돈은 선금으로 받을까 후불로 받을까?\n\n2. 돈을 선금으로 받을 경우\n→ 회사 자체 예산으로는 프로젝트 착공이\n어렵거나, 지연될 가능성이 있을 경우\n\n아파트 분양에서 선분양으로 계약금을 \n받고 공사를 시작하는 것과 비슷한 원리\n\n돈을 후불로 받는 경우\n→ 프로젝트 진행 기간의 물가 변동, 비용 상승을\n그대로 반영해서 청구하고 이자도 받아낼 경우\n\n여기서 물가는 마트에서 사는 채소 물가 수준이 아니라\n계약에서의 자동 변동 조항을 뜻하는\n에스컬레이션(Escalation)이다\n\n자, 여기까지가 이론이고 그럼\n한전이 전기료를 선납으로 받겠다는건 \n어떤 의미일까? \n\n결론\n\n3. 결론\n기사에서 나온 전기료 선납 제안의 배경은\n이것일 것이다.\n\n1) 한전은 고객(삼성/SK하이닉스)이\n요구하는 인프라 확장을 '제때' 완료할 수 있을만큼의\n현금흐름이 현재 없다\n(현재 한전 부채 이자비용만 하루 115억원이고\n고객 요청 외에 기존에 계획된 인프라 확충 계획에\n이미 대다수의 예산이 투입되었을 것이다)\n\n2) 시간이 넉넉히 주어진다면 모를까\nAI 시대에 세계가 원하는만큼의 반도체 공급 물량, 납기를\n지키기 위해 삼전/닉스는 당연히\n최대한 빨리 공급망을 건설하길 바라고 독촉할 것이다\n\n3) 당장 돈은 없는데 정부와 고객은 독촉하고 있고\n인프라는 빨리 지어야하니 수탁 계약 금액 외에\n추가 자금을 빨리 조달하기 위해서 \n짜내고 짜낸 궁여지책이 아닐까 생각된다\n\n4. 공공기관 취업 준비생은\n기업 분석을 위해 \n뉴스 기사를 참조하는 것도 좋지만\n\n그 이면에 왜 이런 일이 생겼을까 하는\n'배경'을 파악하는 것이 중요하다\n\n예비 실무자로서 회사의 이슈를 바라봐야하고\n이 이슈는 회사에 긍정적인지, 부정적인지\n\n부정적이라면 대안은 무엇인지\n비판적 사고로 고민을 해봐야\n좋은 면접 답변이 나온다\n\n평소에 이런 생각을 습관 들이면\nPT면접이나 임원 면접은 따로 \n큰 시간을 들여 연습하지 않아도 될 것이고\n당연히 차별화된 지원자로 보이게 될 것이다", "d": "2026-09-03", "cat": "면접 준비 팁", "fav": false, "h": false}, {"c": "Db-Xc0miOkV", "u": "https://www.threads.com/@jickjin2025/post/Db-Xc0miOkV", "du": "threads.com/@jickjin2025/post/Db-Xc0miOkV", "t": "공기업 체험형 인턴 업무 중이라면", "at": "공기업 체험형 인턴 업무 중이라면", "s": "이런 노력도 해보자 → 사내에서 진행하는 교육, 행사들 인턴이라면 꼭 주의깊게 보고 기록하자 현직자는 지루해하고 관심이 없어도 사내 행사, 교육은 회사의 의도를 알 수 있는 소스라고 말했었다 회사의 노력을 이해하고 설명할 수 있는 지원자 그 노력을 …", "b": "공기업 체험형 인턴 업무 중이라면\n이런 노력도 해보자\n\n→ 사내에서 진행하는 교육, 행사들\n인턴이라면 꼭 주의깊게 보고 기록하자\n\n현직자는 지루해하고 관심이 없어도\n사내 행사, 교육은 \n회사의 의도를 알 수 있는 소스라고 말했었다\n\n회사의 노력을 이해하고 설명할 수 있는 지원자\n그 노력을 비판적으로 분석하고\n개선안을 낼 수 있는 지원자\n\n면접관을 흡족하게 할 것이다", "d": "2026-08-13", "cat": "면접 준비 팁", "fav": false, "h": false}, {"c": "DQyicBJEntG", "u": "https://www.threads.com/@jickjin2025/post/DQyicBJEntG", "du": "threads.com/@jickjin2025/post/DQyicBJEntG", "t": "면접에 ‘익숙한 사람’이 되자.", "at": "면접에 ‘익숙한 사람’이 되자.", "s": "1. 환경 복제하기 실제 면접처럼 책상, 의자, 복장까지 세팅하자. 몸이 익숙해지면 두뇌는 덜 긴장한다. 2. 녹화 점검하기 혼자 준비하는 사람은 특히 해봐야한다. 첫 녹화 영상을 보면 긴장, 실수가 생각보다 많이 보일 것이다. 이것말고도 팁이 많지…", "b": "면접에 ‘익숙한 사람’이 되자.\n\n1. 환경 복제하기\n실제 면접처럼 책상, 의자, 복장까지 세팅하자.\n몸이 익숙해지면 두뇌는 덜 긴장한다.\n\n2. 녹화 점검하기\n혼자 준비하는 사람은 특히 해봐야한다.\n첫 녹화 영상을 보면 긴장, 실수가\n생각보다 많이 보일 것이다.\n\n이것말고도 팁이 많지만 우선 2개만.\n\n모의 환경에서의 반복적인 훈련\n긴장을 없앨 순 없지만 다스릴 순 있다.", "d": "2025-11-08", "cat": "면접 준비 팁", "fav": false, "h": false}, {"c": "DOBXh2xEgK2", "u": "https://www.threads.com/@jickjin2025/post/DOBXh2xEgK2", "du": "threads.com/@jickjin2025/post/DOBXh2xEgK2", "t": "탈락자와 합격자의 멘탈 관리 차이점", "at": "탈락자와 합격자의 멘탈 관리 차이점", "s": "1. 탈락 후 회복법 탈락자 : 탈락 공지 확인 후 멘붕, 돌아보지 않음 vs 합격자 : 고통스럽지만 탈락한 회사 피드백(자소서, 면접) 2. 루틴 관리 탈락자 : 공고 뜨면 벼락치기로 준비 vs 합격자 : 매일 일정한 학습, 휴식 루틴(주말 포함)…", "b": "-탈락자와 합격자의 멘탈 관리 차이점\n\n1. 탈락 후 회복법\n탈락자 : 탈락 공지 확인 후 멘붕, 돌아보지 않음\nvs 합격자 : 고통스럽지만 탈락한 회사 피드백(자소서, 면접)\n \n2. 루틴 관리\n탈락자 : 공고 뜨면 벼락치기로 준비\nvs 합격자 : 매일 일정한 학습, 휴식 루틴(주말 포함)\n\n3. 비교 의식 대응법\n탈락자 : 주위 합격소식 듣고 조급해짐. 주변 스펙/결과에 집착\nvs 합격자 : 자신의 작은 성과/경험/루틴 점검에 집중", "d": "2025-08-31", "cat": "동기부여와 멘탈관리", "fav": false, "h": false}, {"c": "Db5N6RwkgIN", "u": "https://www.threads.com/@jickjin2025/post/Db5N6RwkgIN", "du": "threads.com/@jickjin2025/post/Db5N6RwkgIN", "t": "내가 상담한 공기업 취준생의 거의 95%가", "at": "내가 상담한 공기업 취준생의 거의 95%가", "s": "할 줄 모르고 있었던 것 → 자신만의 취업공부 루틴을 만드는 것 학생들이 스펙, 자소서, 면접, NCS 등 해야할 것에 압도되어있는 경우가 많았다 그래서 하고는 있는데 불안과 긴장감이 있었고 무엇에 얼마나 시간을 투자해야할지를 어려워했다 답부터 말하…", "b": "내가 상담한 공기업 취준생의 거의 95%가\n할 줄 모르고 있었던 것\n\n→ 자신만의 취업공부 루틴을 만드는 것\n\n학생들이 스펙, 자소서, 면접, NCS 등 \n해야할 것에 압도되어있는 경우가 많았다\n\n그래서 하고는 있는데 불안과 긴장감이 있었고 \n무엇에 얼마나 시간을 투자해야할지를\n어려워했다\n\n답부터 말하자면 지원 분야와 기업부터 정하고\n스펙을 순서대로, 또는 동시에 준비해야하고\n그를 위한 루틴을 짜면 된다\n\n사기업에 비해 다소 고지식해보이긴 해도\n공기업 취업을 위해 준비해야할 것은\n너무 분명하게 정해져있다", "d": "2026-08-11", "cat": "동기부여와 멘탈관리", "fav": false, "h": false}, {"c": "DPkN-zMiea1", "u": "https://www.threads.com/@jickjin20 const EDIT = "";  // 편집 모드에서만 값이 있음 (바탕화면 파일은 빈 문자열 = 읽기 전용)

const favs = new Set([...(JSON.parse(localStorage.getItem(LS_KEY) || "[]")), ...POSTS.filter(p => p.fav).map(p => p.c)]);

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function hl(text, terms) {
  let out = esc(text);
  terms.forEach(t => out = out.replace(new RegExp(reEsc(esc(t)), "gi"), m => `<mark>${m}</mark>`));
  return out;
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2200); }

function titleCell(p, terms) {

}
function lastCell(p, terms) {

}

    if (!res.ok || !out.ok) throw new Error(out.error || res.status);
    Object.assign(POSTS.find(p => p.c === code), out.post);
    toast("저장됨 · 바탕화면 아카이브에도 반영됐어요");
  } catch (err) {
    toast("저장 실패: " + err.message + " (편집 창을 연 프로그램이 꺼졌는지 확인)");
  }
  render();
}

function startEdit(span) {
  const p = POSTS.find(x => x.c === span.dataset.ed);
  const input = document.createElement("input");
  input.value = p.t;
  span.parentElement.replaceChildren(input);
  input.focus(); input.select();
  let done = false;
  const finish = commit => {
    if (done) return; done = true;
    const v = input.value.trim();
    if (commit && v !== p.t) save(p.c, { title: v }); else render();
  };
  input.addEventListener("keydown", e => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); });
  input.addEventListener("blur", () => finish(true));
}

$("jump").addEventListener("click", e => {
  if (!e.target.closest("#star")) return;
  state.starOnly = !state.starOnly; render();
});
$("sections").addEventListener("click", e => {
  const ed = EDIT && e.target.closest("[data-ed]");
  if (ed) return startEdit(ed);
  const hide = EDIT && e.target.closest("[data-hide]");
  if (hide) { const p = POSTS.find(x => x.c === hide.dataset.hide); return save(p.c, { hidden: !p.h }); }
  const fav = e.target.closest("[data-fav]");
  if (!fav) return;
  const c = fav.dataset.fav;
  favs.has(c) ? favs.delete(c) : favs.add(c);
  localStorage.setItem(LS_KEY, JSON.stringify([...favs]));
  if (state.starOnly) render();
  else { fav.classList.toggle("on"); $("star").querySelector(".n").textContent = favs.size; }
});
$("sections").addEventListener("change", e => {
  const sel = EDIT && e.target.closest("[data-cat]");
  if (sel) save(sel.dataset.cat, { category: sel.value });
});
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("export").addEventListener("click", () => navigator.clipboard.writeText([...favs].join("\n"))
  .then(() => toast(`⭐ ${favs.size}개 복사됨 → config/archive_favorites.txt 에 붙여넣기`)));
if (EDIT) $("editbar").hidden = false;
// 편집 모드: 공개 페이지 업로드는 버튼을 눌렀을 때만 (업로드마다 Netlify 무료 사용량 차감)
document.addEventListener("click", async e => {
  const btn = EDIT && e.target.closest("#publish");
  if (!btn) return;
  btn.disabled = true; const label = btn.textContent; btn.textContent = "올리는 중… (1~3분, 창을 닫지 마세요)";
  try {
    const res = await fetch("/api/publish", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: EDIT }) });
    const out = await res.json();
    if (!res.ok || !out.ok) throw new Error(out.error || res.status);
    toast("공개 페이지에 반영했어요: " + out.url);
  } catch (err) {
    alert("공개 페이지 반영 실패\n\n" + err.message + "\n\n(내 PC의 바탕화면 아카이브와 수정 내용은 그대로 저장돼 있어요)");
  } finally { btn.disabled = false; btn.textContent = label; }
});
if (PUBLIC) $("export").hidden = true;
render();
</script>
</body>
</html>
